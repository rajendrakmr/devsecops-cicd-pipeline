name: Code Quality

on:
    workflow_call:

jobs:
    codequality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup NodeJs
              uses: actions/setup-node@v7

            - name: Install dependency
              run: npm install

            - name: Run linter
              run: npm run lint
