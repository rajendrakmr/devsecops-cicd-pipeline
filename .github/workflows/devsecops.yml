name: DevSecOps CICD Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint-validate:
    uses: ./.github/workflows/code-quality.yml

  code-quality:
    uses: ./.github/workflows/sonar-quality.yml
    secrets: inherit

  gitleaks:
    uses: ./.github/workflows/secrets-scan.yml
    secrets: inherit

  dockerfile:
    uses: ./.github/workflows/docker-lint.yml

  docker-registry:
    needs: [lint-validate,code-quality,dockerfile,gitleaks]
    uses: ./.github/workflows/docker-build-and-push.yml
    secrets: inherit

  registry-image:
    needs: [docker-registry]
    uses: ./.github/workflows/image-scan.yml
    secrets: inherit
